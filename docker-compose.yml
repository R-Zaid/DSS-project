services:
    
    flask-app:
        build:
            context: .
            dockerfile: dashboard/Dockerfile_dashboard
        ports:
            - 8080:5000
        environment:
            - NAME=Flask-App
            - PYTHONPATH=/app
            - DATABASE_URL=postgresql://student:infomdss@db_dashboard:5432/dashboard
        volumes:
            - ./data:/data
        working_dir: /app
        depends_on:
            db_dashboard:
                condition: service_healthy


    streamlit-app:
        build:
            context: .
            dockerfile: dashboard/Dockerfile_streamlit  
        ports:
            - 8501:8501
        environment:
            - NAME=Streamlit-App
            - PYTHONPATH=/app
            - DATABASE_URL=postgresql://student:infomdss@db_dashboard:5432/dashboard
        volumes:
            - ./data:/data
        working_dir: /app
        depends_on:
            db_dashboard:
                condition: service_healthy
    
    db_dashboard:
        image: postgres:13
        ports:
            - 5432:5432
        environment:
            - POSTGRES_USER=student
            - POSTGRES_PASSWORD=infomdss
            - POSTGRES_DB=dashboard
        volumes:
            - postgres_data:/var/lib/postgresql/data
        container_name: dss_group1_project
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U student -d dashboard"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s


volumes:
    postgres_data:
        driver: local